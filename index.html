<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
      padding-bottom: 20px;
    }
    header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .key-box {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .key-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: white;
      font-size: 14px;
      margin-top: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #333;
    }
    .card:active { background: #252525; }
    .emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .name { font-weight: 600; margin-bottom: 4px; }
    .desc { font-size: 12px; color: #aaa; }
    #chatPage { display: none; }
    #messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 60vh;
      padding-bottom: 80px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
    }
    .user { background: #2563eb; align-self: flex-end; }
    .ai { background: #262626; align-self: flex-start; }
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: #1a1a1a;
      display: flex;
      gap: 8px;
      border-top: 1px solid #333;
    }
    .input-bar input {
      flex: 1;
      padding: 14px;
      border-radius: 24px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
    }
    .input-bar button {
      padding: 0 18px;
      border-radius: 24px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }
    .back {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <div id="homePage">
    <header>Sticky AI</header>
    <div class="key-box">
      <div style="font-size:13px;color:#aaa">Clé OpenRouter :</div>
      <input type="text" id="apiKey" placeholder="sk-or-v1-...">
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="chatPage">
    <header>
      <button class="back" onclick="goHome()">←</button>
      <span id="chatTitle">Chat</span>
    </header>
    <div id="messages"></div>
    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Écris un message...">
      <button onclick="send()">Envoyer</button>
    </div>
  </div>

  <script>
    var chars = [
      { name: "Luna", emoji: "👩", desc: "22 ans, douce", prompt: "Tu es Luna, 22 ans, douce et un peu timide. Tu parles naturellement en français." },
      { name: "Alex", emoji: "👨", desc: "25 ans, calme", prompt: "Tu es Alex, 25 ans, calme et protecteur. Tu parles naturellement en français." },
      { name: "Mia", emoji: "👩‍🦰", desc: "20 ans, énergique", prompt: "Tu es Mia, 20 ans, énergique et directe. Tu parles naturellement en français." },
      { name: "Noah", emoji: "👨‍🦱", desc: "23 ans, drôle", prompt: "Tu es Noah, 23 ans, drôle et détendu. Tu parles naturellement en français." },
      { name: "Sofia", emoji: "👩", desc: "27 ans, mature", prompt: "Tu es Sofia, 27 ans, mature et confiante. Tu parles naturellement en français." },
      { name: "Léo", emoji: "🧔", desc: "24 ans, franc", prompt: "Tu es Léo, 24 ans, sportif et franc. Tu parles naturellement en français." }
    ];

    var current = null;
    var history = [];

    var keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("or_key") || "";
    keyInput.oninput = function() {
      localStorage.setItem("or_key", keyInput.value.trim());
    };

    // Afficher les cartes (sans template literal pour éviter les problèmes de copier-coller)
    var grid = document.getElementById("grid");
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i];
      var div = document.createElement("div");
      div.className = "card";
      div.innerHTML = '<div class="emoji">' + c.emoji + '</div><div class="name">' + c.name + '</div><div class="desc">' + c.desc + '</div>';
      div.onclick = (function(char) {
        return function() { openChat(char); };
      })(c);
      grid.appendChild(div);
    }

    function openChat(c) {
      current = c;
      history = [{ role: "system", content: c.prompt }];
      document.getElementById("homePage").style.display = "none";
      document.getElementById("chatPage").style.display = "block";
      document.getElementById("chatTitle").textContent = c.name;
      document.getElementById("messages").innerHTML = "";
      addMsg("Salut ! Je suis " + c.name + " 😊", false);
    }

    function goHome() {
      document.getElementById("homePage").style.display = "block";
      document.getElementById("chatPage").style.display = "none";
    }

    function addMsg(text, isUser) {
      var d = document.createElement("div");
      d.className = "msg " + (isUser ? "user" : "ai");
      d.textContent = text;
      document.getElementById("messages").appendChild(d);
      d.scrollIntoView();
    }

    async function send() {
      var text = document.getElementById("userInput").value.trim();
      if (!text || !current) return;

      var key = keyInput.value.trim();
      if (!key.startsWith("sk-or-")) {
        addMsg("⚠️ Mets une vraie clé OpenRouter", false);
        return;
      }

      addMsg(text, true);
      document.getElementById("userInput").value = "";
      history.push({ role: "user", content: text });

      try {
        var res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openrouter/free",
            messages: history
          })
        });
        var data = await res.json();
        if (data.error) {
          addMsg("❌ " + data.error.message, false);
          return;
        }
        var reply = data.choices[0].message.content;
        addMsg(reply, false);
        history.push({ role: "assistant", content: reply });
      } catch (e) {
        addMsg("❌ Erreur de connexion", false);
      }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
