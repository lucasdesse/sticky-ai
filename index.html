<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: 600;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .ai {
      background: #262626;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 12px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 14px;
      border-radius: 24px;
      border: none;
      background: #333;
      color: white;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 0 20px;
      border-radius: 24px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .settings {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 13px;
      color: #aaa;
    }
    .settings input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      background: #333;
      border: none;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>Sticky AI</header>

  <div class="settings">
    <div>Clé OpenRouter :</div>
    <input type="text" id="apiKey" placeholder="Colle ta clé ici (elle commence par sk-or-...)">
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Écris un message..." autocomplete="off">
    <button onclick="sendMessage()">Envoyer</button>
  </div>

  <script>
    const character = {
      name: "Luna",
      personality: "Tu es Luna, une fille de 22 ans, naturelle, un peu timide mais chaleureuse. Tu parles de façon réaliste et moderne, comme une vraie personne. Tu es curieuse et tu poses des questions."
    };

    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const apiKeyInput = document.getElementById('apiKey');

    // Charger la clé
    const savedKey = localStorage.getItem('openrouter_key');
    if (savedKey) apiKeyInput.value = savedKey;

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
    });

    let messages = [
      { role: "system", content: character.personality }
    ];

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'ai'}`;
      div.textContent = text;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const key = apiKeyInput.value.trim();
      
      if (!key) {
        addMessage("⚠️ Colle ta clé OpenRouter en haut d'abord", false);
        return;
      }

      if (!key.startsWith("sk-or-")) {
        addMessage("⚠️ Ta clé semble incorrecte. Elle doit commencer par sk-or-", false);
        return;
      }

      addMessage(text, true);
      input.value = '';
      messages.push({ role: "user", content: text });

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://sticky-ai.vercel.app",
            "X-Title": "Sticky AI"
          },
          body: JSON.stringify({
            model: "openrouter/free",
            messages: messages
          })
        });

        const data = await response.json();

        if (data.error) {
          addMessage("❌ Erreur : " + (data.error.message || JSON.stringify(data.error)), false);
          return;
        }

        const reply = data.choices?.[0]?.message?.content || "Pas de réponse";
        addMessage(reply, false);
        messages.push({ role: "assistant", content: reply });

      } catch (err) {
        addMessage("❌ Erreur réseau : " + err.message, false);
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    addMessage("Salut ! Je suis Luna. Tu peux me parler 😊", false);
  </script>
</body>
</html>
