<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sticky AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #backBtn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .settings {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 13px;
      color: #aaa;
    }
    .settings input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      background: #333;
      border: none;
      color: white;
      font-size: 14px;
    }
    #home {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .char-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
